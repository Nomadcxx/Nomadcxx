<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 162" width="480" height="162" role="img" aria-label="RAMA — terminal-native tooling for the linux desktop">
  <style>
    text { font-family: ui-monospace, "Cascadia Mono", Menlo, Consolas, monospace; white-space: pre; }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    .sweep { transform-origin: 26px 0; transform: scaleX(0); animation: sweep 900ms cubic-bezier(0.16,1,0.3,1) 400ms forwards; }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes sweep { to { transform: scaleX(1); } }
    @media (prefers-reduced-motion: reduce) {
